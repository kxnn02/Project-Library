<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>My Library</h1>
    <button class="add-book">Add New Book</button>
    <div class="library-container"></div>

    <dialog id="add-book-dialog">
        <form id="add-book-form">
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" required>

            <label for="author">Author:</label>
            <input type="text" id="author" name="author" required>

            <label for="page-count">Pages:</label>
            <input type="number" id="page-count" name="page-count" min="1" required>

            <fieldset>
                <legend>Done reading?</legend>
                <label for="read-yes">Yes</label>
                <input type="radio" id="read-yes" name="isRead" value="yes">
                <label for="read-no">No</label>
                <input type="radio" id="read-no" name="isRead" value="no" checked>
            </fieldset>

            <menu>
                <button type="submit" id="confirm">Add Book</button>
                <button type="button" id="cancel-button">Cancel</button>
            </menu>
        </form>
    </dialog>
</body>
</html>
