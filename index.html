<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script..js" defer></script>
</head>
<body>
    <div class="library"></div>

    <!-- Button to add a new book, it opens up a form using dialog tag -->
    <button class="add-book">Add New book</button>

    <dialog id="add-book-dialog">
        <form method="dialog" id="add-book-form">
            <label for="title">Title of the book: </label>
            <input type="text" id="title" name="title">

            <label for="author">Author's Name: </label>
            <input type="text" id="author" name="author">

            <label for="page-count">Number of Page: </label>
            <input type="number" id="page-count" name="page-count">

            <fieldset>
                <legend>Done Reading?</legend>

                <label for="read-yes">Yes</label>
                <input type="radio" id="read-yes" name="isRead" value="yes">

                <label for="read-no">No</label>
                <input type="radio" id="read-no" name="isRead" value="no">
            </fieldset>

            <menu>
                <button type="submit" id="confirm">Add Book</button>
                <button type="button" id="cancel-button">Cancel</button>
            </menu>
        </form>
    </dialog>
</body>
</html>
